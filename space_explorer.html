<div id="gc" style="position:relative;width:100%;height:500px;overflow:hidden;border-radius:12px;background:#060612;font-family:var(--font-sans,system-ui,sans-serif);">
  <canvas id="cv" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>

  <div style="position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="color:#6a9fcf;font-size:10px;letter-spacing:0.8px;font-weight:500;">FUEL</span>
      <div style="width:80px;height:5px;background:rgba(255,255,255,0.12);border-radius:3px;overflow:hidden;">
        <div id="ff" style="height:100%;width:100%;background:#6a9fcf;border-radius:3px;transition:width 0.15s;"></div>
      </div>
    </div>
    <div style="color:rgba(255,255,255,0.45);font-size:11px;"><span id="dc">0</span>/15 discovered</div>
    <button onclick="toggleLog()" style="pointer-events:all;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:5px 11px;border-radius:6px;font-size:11px;cursor:pointer;">Ship Log</button>
  </div>

  <div id="ip" style="position:absolute;top:0;right:-265px;bottom:0;width:265px;background:rgba(6,6,20,0.96);border-left:0.5px solid rgba(255,255,255,0.1);padding:48px 16px 16px;overflow-y:auto;transition:right 0.3s;z-index:10;box-sizing:border-box;">
    <div id="ipn" style="font-size:15px;font-weight:500;color:#d8e8f8;margin-bottom:3px;"></div>
    <div id="ipt" style="font-size:10px;color:rgba(255,255,255,0.32);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;"></div>
    <div id="ipl" style="font-size:13px;color:rgba(210,228,250,0.82);line-height:1.65;min-height:60px;"></div>
    <button onclick="closePanel()" style="margin-top:20px;width:100%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.65);padding:7px;border-radius:6px;font-size:11px;cursor:pointer;">Continue exploring</button>
  </div>

  <div id="lp" style="position:absolute;top:0;right:-265px;bottom:0;width:265px;background:rgba(6,6,20,0.97);border-left:0.5px solid rgba(255,255,255,0.1);padding:16px;overflow-y:auto;transition:right 0.3s;z-index:10;box-sizing:border-box;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <span style="color:#d8e8f8;font-size:13px;font-weight:500;">Ship Log</span>
      <button onclick="toggleLog()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:20px;cursor:pointer;padding:0;line-height:1;">×</button>
    </div>
    <div id="le" style="display:flex;flex-direction:column;gap:7px;"></div>
    <div id="le0" style="color:rgba(255,255,255,0.28);font-size:12px;text-align:center;padding:24px 0;line-height:1.9;">No discoveries yet.<br>Click a planet to explore.</div>
  </div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),gc=document.getElementById('gc');
let W=0,H=0,stars=[],nebulae=[],planets=[];
let ship={x:0,y:0,angle:0,speed:2.8,fuel:100,maxFuel:100,traveling:false,tx:0,ty:0,tp:null};
let mx=0,my=0,panel=null,activePlanet=null;

const TYPES=[
  {id:'rocky',    c:'#7a6448',hi:'#a08060',lo:'#4a3c28',atm:null},
  {id:'ocean',    c:'#1a5a9a',hi:'#3a8ac0',lo:'#0a3060',atm:'rgba(100,180,255,0.22)'},
  {id:'desert',   c:'#b86428',hi:'#d88040',lo:'#804020',atm:'rgba(240,160,80,0.18)'},
  {id:'ice',      c:'#90c8e8',hi:'#c8e8f8',lo:'#5090b8',atm:'rgba(180,230,255,0.25)'},
  {id:'jungle',   c:'#286832',hi:'#409850',lo:'#184820',atm:'rgba(80,180,100,0.22)'},
  {id:'gas giant',c:'#a86818',hi:'#d89040',lo:'#784808',atm:null,rings:true},
  {id:'volcanic', c:'#901808',hi:'#c04020',lo:'#601008',atm:'rgba(255,60,20,0.18)'},
  {id:'crystal',  c:'#7838b0',hi:'#a060d8',lo:'#481878',atm:'rgba(180,120,255,0.22)'},
  {id:'toxic',    c:'#5a9010',hi:'#80b820',lo:'#386008',atm:'rgba(140,220,40,0.25)'},
];
const PFX=['Zar','Vel','Kor','Myx','Tor','Bel','Fen','Gal','Pyx','Sol','Lum','Nex','Vor','Aph','Elt','Dri'];
const SFX=['ix','on','ara','ius','eth','orn','ax','us','eia','os','yne','eli','ath','ov','ux','enn'];

function rnd(a,b){return a+Math.random()*(b-a);}
function pName(){return PFX[0|rnd(0,PFX.length)]+SFX[0|rnd(0,SFX.length)];}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

function setup(){
  const r=gc.getBoundingClientRect();
  W=r.width||680; H=gc.offsetHeight||500;
  cv.width=W; cv.height=H;
  ship.x=W/2; ship.y=H/2;
  stars=[];
  for(let i=0;i<220;i++) stars.push({x:rnd(0,W),y:rnd(0,H),r:rnd(0.25,1.3),op:rnd(0.3,0.85),sp:rnd(0.005,0.025),ph:rnd(0,Math.PI*2)});
  const nc=['rgba(80,40,160,','rgba(20,60,140,','rgba(140,30,80,','rgba(30,100,80,'];
  nebulae=[];
  for(let i=0;i<4;i++) nebulae.push({x:rnd(W*.15,W*.85),y:rnd(H*.15,H*.85),r:rnd(100,180),c:nc[i]});
  planets=[];
  const names=new Set();
  let tries=0;
  while(planets.length<15&&tries<1000){
    tries++;
    const r=0|rnd(18,40);
    const x=rnd(r+35,W-r-35), y=rnd(r+55,H-r-30);
    let ok=Math.hypot(x-ship.x,y-ship.y)>110;
    for(const p of planets){if(Math.hypot(p.x-x,p.y-y)<p.r+r+80){ok=false;break;}}
    if(!ok)continue;
    const t=TYPES[0|rnd(0,TYPES.length)];
    let name; do{name=pName();}while(names.has(name)); names.add(name);
    const rgb=hexRgb(t.c);
    const rings=!!t.rings||(Math.random()>0.88);
    const moon=!rings&&Math.random()>0.55;
    planets.push({x,y,r,name,type:t.id,c:t.c,hi:t.hi,lo:t.lo,atm:t.atm,rgb,rings,moon,
      ma:rnd(0,Math.PI*2),md:r+rnd(10,16),mr:rnd(2.5,4.5),
      refuel:Math.random()>0.78,lore:null,disc:false});
  }
}

function drawNebula(){
  for(const n of nebulae){
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,n.c+'0.05)'); g.addColorStop(1,n.c+'0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
  }
}

function drawStars(t){
  for(const s of stars){
    const op=s.op*(0.65+0.35*Math.sin(t*s.sp+s.ph));
    ctx.fillStyle=`rgba(255,255,255,${op.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
}

function drawRange(){
  if(ship.traveling)return;
  ctx.save(); ctx.setLineDash([3,5]);
  ctx.strokeStyle='rgba(100,160,240,0.13)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(ship.x,ship.y,ship.fuel*8,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawPath(){
  if(!ship.traveling)return;
  ctx.save(); ctx.setLineDash([4,8]);
  ctx.strokeStyle='rgba(100,160,240,0.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(ship.x,ship.y); ctx.lineTo(ship.tx,ship.ty); ctx.stroke();
  ctx.restore();
}

function drawPlanet(p,hov,t){
  ctx.save();
  const [cr,cg,cb]=p.rgb;
  if(p.rings){
    ctx.save();
    ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*1.82,p.r*0.38,0.28,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},0.55)`; ctx.lineWidth=5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*2.1,p.r*0.46,0.28,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${cr},${cg},${cb},0.28)`; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }
  if(hov){
    const g=ctx.createRadialGradient(p.x,p.y,p.r,p.x,p.y,p.r*2.3);
    g.addColorStop(0,`rgba(${cr},${cg},${cb},0.18)`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.3,0,Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=p.c; ctx.fill();
  if(p.type==='gas giant'){
    ctx.save(); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.clip();
    const bs=[p.hi,p.c,p.lo,p.hi,p.c,p.lo], bh=p.r*2/bs.length;
    for(let i=0;i<bs.length;i++){ctx.fillStyle=bs[i];ctx.fillRect(p.x-p.r,p.y-p.r+bh*i,p.r*2,bh+1);}
    ctx.restore();
  }
  if(p.atm){
    const g=ctx.createRadialGradient(p.x,p.y,p.r*0.75,p.x,p.y,p.r*1.22);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,p.atm);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*1.22,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  }
  const hl=ctx.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.32,0,p.x,p.y,p.r);
  hl.addColorStop(0,'rgba(255,255,255,0.28)'); hl.addColorStop(0.45,'rgba(255,255,255,0.06)'); hl.addColorStop(1,'rgba(0,0,0,0.32)');
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle=hl; ctx.fill();
  if(p.moon){
    const a=p.ma+t*0.0007;
    ctx.beginPath(); ctx.arc(p.x+Math.cos(a)*p.md,p.y+Math.sin(a)*p.md*0.55,p.mr,0,Math.PI*2);
    ctx.fillStyle='#9090a0'; ctx.fill();
  }
  ctx.textAlign='center';
  ctx.fillStyle=`rgba(210,228,248,${p.disc?0.9:hov?0.7:0.38})`;
  ctx.font=`${p.disc?500:400} 11px system-ui,sans-serif`;
  ctx.fillText(p.name,p.x,p.y+p.r+14);
  if(p.disc){
    ctx.fillStyle='rgba(90,170,250,0.75)'; ctx.font='9px system-ui,sans-serif';
    ctx.fillText('✓ visited',p.x,p.y+p.r+25);
  } else if(p.refuel&&hov){
    ctx.fillStyle='rgba(240,190,60,0.8)'; ctx.font='9px system-ui,sans-serif';
    ctx.fillText('⬡ fuel cache',p.x,p.y+p.r+25);
  }
  ctx.restore();
}

function drawShip(){
  ctx.save(); ctx.translate(ship.x,ship.y); ctx.rotate(ship.angle);
  if(ship.traveling){
    const f=0.5+0.5*Math.random();
    ctx.fillStyle=`rgba(80,140,255,${0.25*f})`;
    ctx.beginPath(); ctx.ellipse(0,8+Math.random()*5,4,8+Math.random()*6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(200,225,255,${0.55*f})`;
    ctx.beginPath(); ctx.ellipse(0,7,2,4,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#c0d0e8';
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(7,7); ctx.lineTo(0,3.5); ctx.lineTo(-7,7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7ab8f8';
  ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(3.5,-1); ctx.lineTo(-3.5,-1); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function loop(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#060612'; ctx.fillRect(0,0,W,H);
  drawNebula(); drawStars(t); drawRange(); drawPath();
  let hov=null;
  for(const p of planets){if(Math.hypot(mx-p.x,my-p.y)<=p.r+10){hov=p;break;}}
  for(const p of planets) drawPlanet(p,p===hov,t);
  if(ship.traveling){
    const dx=ship.tx-ship.x,dy=ship.ty-ship.y,d=Math.hypot(dx,dy);
    ship.angle=Math.atan2(dx,-dy);
    if(d<ship.speed+1){
      ship.x=ship.tx; ship.y=ship.ty; ship.traveling=false;
      if(ship.tp)onArrive(ship.tp);
    } else {
      const spd=ship.speed+(d>150?1.2:0);
      ship.x+=dx/d*spd; ship.y+=dy/d*spd;
      ship.fuel=Math.max(0,ship.fuel-spd/8); setFuel();
    }
  } else if(ship.fuel<ship.maxFuel){
    ship.fuel=Math.min(ship.maxFuel,ship.fuel+0.06); setFuel();
  }
  drawShip();
  cv.style.cursor=hov&&!ship.traveling?'pointer':'default';
  requestAnimationFrame(loop);
}

function getPos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('mousemove',e=>{const p=getPos(e);mx=p.x;my=p.y;});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];if(t){const p=getPos(t);mx=p.x;my=p.y;}},{passive:false});
function onClick(cx,cy){
  if(ship.traveling)return;
  for(const p of planets){if(Math.hypot(cx-p.x,cy-p.y)<=p.r+12){travelTo(p);return;}}
}
cv.addEventListener('click',e=>{const p=getPos(e);onClick(p.x,p.y);});
cv.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];if(t){const p=getPos(t);onClick(p.x,p.y);}},{passive:false});

function travelTo(p){
  if(Math.hypot(p.x-ship.x,p.y-ship.y)/8>ship.fuel){toast('Not enough fuel — recharging...');return;}
  closePanel(); ship.tx=p.x; ship.ty=p.y; ship.tp=p; ship.traveling=true;
}

async function onArrive(p){
  activePlanet=p;
  if(p.refuel){ship.fuel=Math.min(ship.maxFuel,ship.fuel+40);setFuel();toast('+40 fuel from cache');}
  if(!p.disc){
    p.disc=true;
    document.getElementById('dc').textContent=planets.filter(x=>x.disc).length;
    addLogEntry(p);
    if(planets.every(x=>x.disc))setTimeout(()=>toast('Galaxy fully explored! Safe travels, explorer.'),500);
  }
  showInfo(p,p.lore||'Scanning planet...');
  if(!p.lore){
    p.lore=await fetchLore(p);
    if(activePlanet===p)document.getElementById('ipl').textContent=p.lore;
  }
}

async function fetchLore(p){
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:`Write a 2-3 sentence first-person explorer's log for discovering planet "${p.name}", a ${p.type} world. Include one striking anomaly or discovery. Evocative sci-fi tone. Under 55 words. Reply with just the log entry, no preamble.`}]})
    });
    const d=await res.json();
    return d.content?.find(c=>c.type==='text')?.text||`${p.name} logged. A ${p.type} world of quiet wonder.`;
  }catch{
    return `${p.name} — a ${p.type} world logged ${new Date().toISOString().slice(0,10)}. Initial scans reveal readings worth further investigation.`;
  }
}

function showInfo(p,lore){
  document.getElementById('ipn').textContent=p.name;
  document.getElementById('ipt').textContent=p.type.toUpperCase()+' WORLD';
  document.getElementById('ipl').textContent=lore;
  document.getElementById('ip').style.right='0';
  document.getElementById('lp').style.right='-265px';
  panel='info';
}
function closePanel(){
  document.getElementById('ip').style.right='-265px';
  document.getElementById('lp').style.right='-265px';
  panel=null;
}
function toggleLog(){
  if(panel==='log'){closePanel();}else{
    document.getElementById('lp').style.right='0';
    document.getElementById('ip').style.right='-265px';
    panel='log';
  }
}
function addLogEntry(p){
  document.getElementById('le0').style.display='none';
  const el=document.createElement('div');
  el.style.cssText='background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 10px;cursor:pointer;';
  el.innerHTML=`<div style="font-size:12px;font-weight:500;color:#d0e0f4;">${p.name}</div><div style="font-size:10px;color:rgba(255,255,255,0.32);letter-spacing:0.8px;text-transform:uppercase;margin-top:2px;">${p.type}</div>`;
  el.onclick=()=>showInfo(p,p.lore||'Loading...');
  document.getElementById('le').prepend(el);
}
function setFuel(){
  const pct=ship.fuel/ship.maxFuel;
  document.getElementById('ff').style.width=(pct*100).toFixed(1)+'%';
  document.getElementById('ff').style.background=pct>0.5?'#6a9fcf':pct>0.25?'#d4a040':'#d05040';
}
function toast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(8,8,28,0.92);border:0.5px solid rgba(255,255,255,0.15);color:rgba(220,235,255,0.9);padding:7px 16px;border-radius:8px;font-size:11px;z-index:30;pointer-events:none;white-space:nowrap;';
  gc.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

setTimeout(()=>{setup();requestAnimationFrame(loop);},80);
</script>
